<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blood Pressure History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<script src="i18n.js" defer></script>
<style>
  :root{
    --bg: #F1F6F4;
    --card: #FFFFFF;
    --ink: #163832;
    --ink-soft: #4B6660;
    --teal: #2F6259;
    --teal-dark: #1E463F;
    --dad: #2E5C8A;
    --dad-tint: #E7EEF6;
    --mum: #B34A5E;
    --mum-tint: #F7E9EC;
    --line: #DCE7E3;
    --high: #C0392B;
    --shadow: 0 8px 24px rgba(22,56,50,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Atkinson Hyperlegible', system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 16px 80px;
  }
  .wrap{width:100%;max-width:480px; position:relative;}
  .lang-toggle{
    position:fixed; bottom:16px; right:16px; z-index:20;
    width:148px; height:44px; box-sizing:border-box;
    background:#fff; border:2px solid var(--line); border-radius:999px;
    padding:4px; box-shadow:var(--shadow);
  }
  .lang-slider{
    position:absolute; top:4px; left:4px; width:66px; height:34px;
    background:var(--teal); border-radius:999px; transition:transform .25s ease;
  }
  .lang-opt-row{position:relative; z-index:1; display:flex; height:100%;}
  .lang-opt{
    flex:1; border:none; background:transparent; cursor:pointer;
    font-family:'Atkinson Hyperlegible', sans-serif; font-weight:700; font-size:14px;
    color:var(--ink-soft);
  }
  .lang-opt.active{color:#fff;}
  .nav{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:14px;
  }
  .nav a{
    text-decoration:none;
    font-weight:700;
    font-size:14px;
    color:var(--teal-dark);
    background:#fff;
    border:2px solid var(--line);
    padding:8px 14px;
    border-radius:999px;
  }
  .nav a.active{background:var(--teal); color:#fff; border-color:var(--teal);}
  header{text-align:center; margin:8px 0 20px;}
  .eyebrow{
    font-size:15px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ink-soft); font-weight:700;
  }
  h1{
    font-family:'Fraunces', serif; font-size:28px; margin:6px 0 0;
    font-weight:700; color:var(--teal-dark);
  }
  .card{
    background:var(--card); border-radius:20px; box-shadow:var(--shadow);
    padding:22px; margin-bottom:16px; border:1px solid var(--line);
  }
  .label{font-size:19px; font-weight:700; margin-bottom:12px; color:var(--ink);}
  .who-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .who-btn{
    border:3px solid var(--line); background:#fff; border-radius:16px;
    padding:16px 8px; font-family:'Atkinson Hyperlegible', sans-serif;
    font-size:22px; font-weight:700; cursor:pointer; transition:all .15s ease; color:var(--ink);
  }
  .who-btn.dad{color:var(--dad);}
  .who-btn.mum{color:var(--mum);}
  .who-btn.selected.dad{background:var(--dad-tint); border-color:var(--dad);}
  .who-btn.selected.mum{background:var(--mum-tint); border-color:var(--mum);}
  .month-field{margin-top:16px;}
  .month-field label{display:block; font-size:16px; color:var(--ink-soft); font-weight:700; margin-bottom:8px;}
  .month-field input{
    width:100%; font-size:22px; font-weight:700; text-align:center;
    padding:12px 6px; border-radius:14px; border:3px solid var(--line);
    color:var(--teal-dark); font-family:'Atkinson Hyperlegible', sans-serif; background:#fbfdfc;
  }
  .month-field input:focus{outline:none; border-color:var(--teal); background:#fff;}
  .go-btn{
    width:100%; margin-top:18px; background:var(--teal); color:#fff; border:none;
    border-radius:16px; padding:18px; font-size:22px; font-weight:700;
    font-family:'Atkinson Hyperlegible', sans-serif; cursor:pointer;
    box-shadow:0 6px 16px rgba(47,98,89,0.35);
  }
  .go-btn:disabled{background:#9db8b2; box-shadow:none;}
  .status{text-align:center; font-size:16px; font-weight:700; margin-top:12px; min-height:22px; color:var(--high);}

  .summary{
    display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;
  }
  .summary .box{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:16px; text-align:center;
  }
  .summary .box .num{font-size:28px; font-weight:700; color:var(--teal-dark); font-family:'Fraunces', serif;}
  .summary .box .cap{font-size:13px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.05em;}

  .entry{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin-bottom:10px;
  }
  .entry .when{font-size:14px; color:var(--ink-soft); font-weight:700; display:flex; align-items:center; gap:6px; margin-bottom:10px;}
  .entry .tod{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    background:var(--bg); border:1px solid var(--line); color:var(--teal-dark);
    border-radius:999px; padding:2px 8px;
  }
  .entry .figures{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;
  }
  .entry .figure{
    text-align:center; background:var(--bg); border-radius:10px; padding:8px 4px;
  }
  .entry .figure .val{font-size:19px; font-weight:700; color:var(--teal-dark); font-family:'Fraunces', serif;}
  .entry .figure .val.blank{color:#B9C8C3;}
  .entry .figure .cap{font-size:11px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}
  .edit-link{
    background:none; border:none; color:var(--teal); font-weight:700; font-size:13px;
    cursor:pointer; padding:2px 4px; font-family:'Atkinson Hyperlegible', sans-serif;
  }
  .edit-form .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:0;}
  .edit-form .field{margin-top:10px;}
  .edit-form .field label{display:block; font-size:13px; color:var(--ink-soft); font-weight:700; margin-bottom:6px;}
  .edit-form .field input{
    width:100%; font-size:20px; font-weight:700; text-align:center; padding:10px 4px;
    border-radius:10px; border:2px solid var(--line); color:var(--teal-dark);
    font-family:'Atkinson Hyperlegible', sans-serif; background:#fbfdfc;
  }
  .edit-form .field input:focus{outline:none; border-color:var(--teal);}
  .edit-ampm{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
  .edit-ampm button{
    border:2px solid var(--line); background:#fff; border-radius:10px; padding:10px 4px;
    font-family:'Atkinson Hyperlegible', sans-serif; font-size:14px; font-weight:700; cursor:pointer; color:var(--ink);
  }
  .edit-ampm button.selected{background:var(--teal); border-color:var(--teal); color:#fff;}
  .edit-actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
  .edit-actions button{
    border:none; border-radius:12px; padding:12px; font-size:16px; font-weight:700;
    font-family:'Atkinson Hyperlegible', sans-serif; cursor:pointer;
  }
  .edit-actions .save-edit{background:var(--teal); color:#fff;}
  .edit-actions .cancel-edit{background:var(--bg); color:var(--ink-soft); border:2px solid var(--line);}
  .empty{
    text-align:center; color:var(--ink-soft); padding:24px 10px; font-size:15px;
  }
  .setup-note{
    background:#FFF6E9; border:1px solid #F1D9A8; color:#7A5A15; border-radius:14px;
    padding:14px 16px; font-size:14px; line-height:1.5; margin-bottom:16px;
  }
</style>
</head>
<body>
<div class="lang-toggle" id="langToggle">
  <div class="lang-slider" id="langSlider"></div>
  <div class="lang-opt-row">
    <button type="button" class="lang-opt" data-lang="en" onclick="setLang('en')">EN</button>
    <button type="button" class="lang-opt" data-lang="np" onclick="setLang('np')">ने</button>
  </div>
</div>
<div class="wrap">
  <div class="nav">
    <a href="index.html" data-i18n="nav_add">Add Reading</a>
    <a href="history.html" class="active" data-i18n="nav_history">History</a>
    <a href="progress.html" data-i18n="nav_progress">Progress</a>
  </div>

  <header>
    <div class="eyebrow" data-i18n="eyebrow">Ghar ko Health Log</div>
    <h1 data-i18n="nav_history">History</h1>
  </header>

  <div id="configNote" class="setup-note" style="display:none;">
    ⚠️ Not connected yet. Paste your Google Sheet link into <code>SCRIPT_URL</code>
    near the top of this page's code — see SETUP-GUIDE.md.
  </div>

  <div class="card">
    <div class="label" data-i18n="whose_history">Whose history?</div>
    <div class="who-row">
      <button type="button" class="who-btn dad" id="btnDad">👨 Ramesh</button>
      <button type="button" class="who-btn mum" id="btnMum">👩 Raje</button>
    </div>
    <div class="month-field">
      <label for="monthPick" data-i18n="which_month">Which month?</label>
      <input type="month" id="monthPick">
    </div>
    <button class="go-btn" id="goBtn" data-i18n="show_history_btn">Show History</button>
    <div class="status" id="status"></div>
  </div>

  <div id="results"></div>
</div>

<script>
  // ---- SETUP: paste the same Google Apps Script Web App URL as index.html ----
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzYjxRnJY1KlLPcBS7j-b69ODzmKfUa2QTIboh3OKSUAxUHHnwRMZ6ddiaT3P55IWoxAQ/exec";
  // ------------------------------------------------------------------------

  const btnDad = document.getElementById('btnDad');
  const btnMum = document.getElementById('btnMum');
  const goBtn = document.getElementById('goBtn');
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');
  const monthPick = document.getElementById('monthPick');
  const configNote = document.getElementById('configNote');

  let selectedPerson = null;
  let currentReadings = [];
  let editingRowId = null;

  if (!SCRIPT_URL || SCRIPT_URL.indexOf("PASTE_YOUR") === 0) {
    configNote.style.display = 'block';
  }

  // default to current month
  const now = new Date();
  monthPick.value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');

  function selectPerson(person, btn){
    selectedPerson = person;
    [btnDad, btnMum].forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  }
  btnDad.addEventListener('click', () => selectPerson('Ramesh', btnDad));
  btnMum.addEventListener('click', () => selectPerson('Raje', btnMum));

  function fmtDate(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString(getLang() === 'np' ? 'ne-NP' : undefined, { weekday:'short', month:'short', day:'numeric' });
  }

  goBtn.addEventListener('click', async () => {
    statusEl.textContent = '';
    resultsEl.innerHTML = '';

    if (!selectedPerson) {
      statusEl.textContent = t('err_choose_person');
      return;
    }
    if (!monthPick.value) {
      statusEl.textContent = t('err_choose_month');
      return;
    }
    if (!SCRIPT_URL || SCRIPT_URL.indexOf("PASTE_YOUR") === 0) {
      statusEl.textContent = t('err_not_connected');
      return;
    }

    goBtn.disabled = true;
    goBtn.textContent = t('loading_btn');

    try {
      const url = SCRIPT_URL + '?action=list&person=' + encodeURIComponent(selectedPerson) + '&month=' + encodeURIComponent(monthPick.value);
      const res = await fetch(url);
      const data = await res.json();
      currentReadings = data.readings || [];
      editingRowId = null;
      renderResults(currentReadings);
    } catch (err) {
      statusEl.textContent = t('err_load_fail');
    } finally {
      goBtn.disabled = false;
      goBtn.textContent = t('show_history_btn');
    }
  });

  window.onLangChange = () => {
    if (currentReadings.length) renderResults(currentReadings);
  };

  function renderResults(readings){
    resultsEl.innerHTML = '';

    if (!readings.length) {
      resultsEl.innerHTML = `<div class="empty">${t('empty_history')}</div>`;
      return;
    }

    // newest first
    readings.sort((a, b) => (a.date + a.time) < (b.date + b.time) ? 1 : -1);

    const bpReadings = readings.filter(r => r.systolic && r.diastolic);
    const weightReadings = readings.filter(r => r.weight);

    const summary = document.createElement('div');
    summary.className = 'summary';
    let summaryHTML = '';
    if (bpReadings.length) {
      const avgSys = Math.round(bpReadings.reduce((s, r) => s + Number(r.systolic), 0) / bpReadings.length);
      const avgDia = Math.round(bpReadings.reduce((s, r) => s + Number(r.diastolic), 0) / bpReadings.length);
      summaryHTML += `<div class="box"><div class="num">${avgSys}/${avgDia}</div><div class="cap">${t('avg_bp')}</div></div>`;
    }
    if (weightReadings.length) {
      const avgW = (weightReadings.reduce((s, r) => s + Number(r.weight), 0) / weightReadings.length).toFixed(1);
      summaryHTML += `<div class="box"><div class="num">${avgW} kg</div><div class="cap">${t('avg_weight')}</div></div>`;
    }
    if (!summaryHTML) {
      summaryHTML = `<div class="box" style="grid-column:1/3;"><div class="num">${readings.length}</div><div class="cap">${t('readings_logged')}</div></div>`;
    }
    summary.innerHTML = summaryHTML;
    resultsEl.appendChild(summary);

    readings.forEach(r => {
      const row = document.createElement('div');
      row.className = 'entry';

      if (r.rowId === editingRowId) {
        row.appendChild(buildEditForm(r));
      } else {
        row.appendChild(buildDisplayView(r));
      }
      resultsEl.appendChild(row);
    });
  }

  function buildDisplayView(r){
    const wrap = document.createElement('div');
    const tag = r.timeOfDay ? `<span class="tod">${r.timeOfDay}</span>` : '';
    const fig = (val, cap) => {
      const has = val !== '' && val !== undefined && val !== null;
      return `<div class="figure"><div class="val${has ? '' : ' blank'}">${has ? val : '–'}</div><div class="cap">${cap}</div></div>`;
    };
    wrap.innerHTML = `
      <div class="when" style="justify-content:space-between; display:flex;">
        <span>${fmtDate(r.date)} ${tag}</span>
        <button type="button" class="edit-link">${t('edit_link')}</button>
      </div>
      <div class="figures">
        ${fig(r.systolic, t('fig_upper'))}
        ${fig(r.diastolic, t('fig_lower'))}
        ${fig(r.pulse, t('fig_pulse'))}
        ${fig(r.weight, t('fig_weight'))}
      </div>
    `;
    wrap.querySelector('.edit-link').addEventListener('click', () => {
      editingRowId = r.rowId;
      renderResults(currentReadings);
    });
    return wrap;
  }

  function buildEditForm(r){
    const wrap = document.createElement('div');
    wrap.className = 'edit-form';
    wrap.innerHTML = `
      <div class="when">${fmtDate(r.date)} ${t('editing_suffix')}</div>
      <div class="edit-ampm">
        <button type="button" class="ampm-opt" data-val="AM">${t('am_btn').replace(' (AM)','')}</button>
        <button type="button" class="ampm-opt" data-val="PM">${t('pm_btn').replace(' (PM)','')}</button>
      </div>
      <div class="field-row">
        <div class="field"><label>${t('fig_upper')}</label><input type="number" inputmode="numeric" class="e-systolic" value="${r.systolic || ''}"></div>
        <div class="field"><label>${t('fig_lower')}</label><input type="number" inputmode="numeric" class="e-diastolic" value="${r.diastolic || ''}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>${t('fig_pulse')}</label><input type="number" inputmode="numeric" class="e-pulse" value="${r.pulse || ''}"></div>
        <div class="field"><label>${t('fig_weight')}</label><input type="number" inputmode="decimal" step="0.1" class="e-weight" value="${r.weight || ''}"></div>
      </div>
      <div class="edit-actions">
        <button type="button" class="cancel-edit">${t('cancel_btn')}</button>
        <button type="button" class="save-edit">${t('save_btn')}</button>
      </div>
    `;
    const ampmBtns = wrap.querySelectorAll('.ampm-opt');
    ampmBtns.forEach(b => {
      if (b.dataset.val === r.timeOfDay) b.classList.add('selected');
      b.addEventListener('click', () => {
        ampmBtns.forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
      });
    });

    wrap.querySelector('.cancel-edit').addEventListener('click', () => {
      editingRowId = null;
      renderResults(currentReadings);
    });

    wrap.querySelector('.save-edit').addEventListener('click', async () => {
      const selectedAmpm = wrap.querySelector('.ampm-opt.selected');
      const updated = {
        rowId: r.rowId,
        person: r.person,
        timeOfDay: selectedAmpm ? selectedAmpm.dataset.val : (r.timeOfDay || ''),
        systolic: wrap.querySelector('.e-systolic').value,
        diastolic: wrap.querySelector('.e-diastolic').value,
        pulse: wrap.querySelector('.e-pulse').value,
        weight: wrap.querySelector('.e-weight').value
      };

      const hasBP = updated.systolic || updated.diastolic;
      const hasBoth = updated.systolic && updated.diastolic;
      if (hasBP && !hasBoth) {
        alert(t('err_bp_both'));
        return;
      }
      if (!hasBoth && !updated.weight) {
        alert(t('err_need_one'));
        return;
      }

      const saveBtnEl = wrap.querySelector('.save-edit');
      saveBtnEl.disabled = true;
      saveBtnEl.textContent = t('saving_btn');

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'update', ...updated })
        });
        // Optimistically update local copy since no-cors hides the real response
        const idx = currentReadings.findIndex(x => x.rowId === r.rowId);
        if (idx > -1) currentReadings[idx] = { ...currentReadings[idx], ...updated };
        editingRowId = null;
        renderResults(currentReadings);
      } catch (err) {
        alert(t('err_edit_fail'));
        saveBtnEl.disabled = false;
        saveBtnEl.textContent = t('save_btn');
      }
    });

    return wrap;
  }
</script>
</body>
</html>
